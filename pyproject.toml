[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gha-workflow-linter"
dynamic = ["version"]
description = "GitHub Actions workflow linter for validating action and workflow calls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "The Linux Foundation", email = "releng@linuxfoundation.org"},
]
keywords = ["github", "actions", "workflows", "linting", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.21.1",
    "pyyaml>=6.0.2",
    "rich>=14.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "mypy>=1.19.1",
    "ruff>=0.14.10",
    "pre-commit>=4.5.1",
    "types-pyyaml>=6.0.12.20241230",
]

[project.urls]
Homepage = "https://github.com/lfit/gha-workflow-linter"
Documentation = "https://gha-workflow-linter.readthedocs.io"
Repository = "https://github.com/lfit/gha-workflow-linter.git"
"Bug Tracker" = "https://github.com/lfit/gha-workflow-linter/issues"
Changelog = "https://github.com/lfit/gha-workflow-linter/releases"

[project.scripts]
gha-workflow-linter = "gha_workflow_linter.cli:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/gha_workflow_linter/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gha_workflow_linter"]

[tool.ruff]
target-version = "py310"
line-length = 80
extend-exclude = ["src/gha_workflow_linter/_version.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused-function-argument
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "Q",      # flake8-quotes
    "PLE",    # pylint errors
    "PLR",    # pylint refactor
    "PLW",    # pylint warnings
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments — see note below
    "PLR2004", # magic value used in comparison
    "PLR0912", # too many branches
    "PLR0915", # too many statements
]

# PLR0917 was stabilised in ruff 0.16.0.  This project already selects
# the "PLR" category, so the rule began firing the moment a routine
# pre-commit autoupdate crossed that release, on code nobody had
# touched.
#
# It is ignored globally, not scoped to tests, because every occurrence
# is in src/ — there are none in the test suite, so a per-file-ignore
# would fix nothing.  The signatures it flags are Typer command
# definitions and internal constructors:
#
#   - cli.py:512 is the `lint` command, with 23 parameters carrying
#     typer.Argument()/typer.Option() defaults.  Typer builds the CLI
#     from that signature, and callers supply the values as command-line
#     flags, never positionally from Python.  A keyword-only signature
#     is not an option: it is how the framework works.  Note B008 is
#     already ignored directly above for the same reason.
#   - the remaining sites (action_call_fix.py, cache.py,
#     action_call_check.py) are internal helpers whose breadth PLR0913
#     already tolerates.
#
# PLR0917 counts only those arguments that may be passed positionally,
# so it is the narrower of the two; ignoring PLR0913 while enforcing
# PLR0917 would be inconsistent.

[tool.ruff.lint.isort]
known-first-party = ["gha_workflow_linter"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.basedpyright]
pythonVersion = "3.10"
# Every tracked Python location. This list governs editor/LSP checking
# and bare `basedpyright` invocations; the pre-commit hook deliberately
# carries no `files:` filter, so it checks every staged Python file
# regardless of what appears here. Keep both in step: if a new
# top-level Python directory appears, add it here too.
include = ["src", "tests", "scripts", "examples"]
# Build artefacts and caches are untracked, but exclude them explicitly
# so a bare invocation never wanders into generated code.
exclude = [
    "**/__pycache__",
    "**/.*",
    "dist",
    "htmlcov",
]
typeCheckingMode = "strict"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
# The hook runs on pre-commit.ci in an isolated environment without the
# project venv, and basedpyright is already ~246MiB so its dependencies
# cannot be bundled without exceeding the 250MiB tier limit. Since imports
# are not required to resolve (reportMissingImports = none), diagnostics
# that only fire because an import is unresolved (an Unknown pydantic
# BaseModel base, an Unknown typer decorator, or yaml lacking bundled
# stubs) must be disabled for internal consistency. They never fire
# locally, where .venv is auto-detected and these types resolve.
reportUntypedBaseClass = "none"
reportUntypedFunctionDecorator = "none"
reportMissingModuleSource = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
# Focus on real issues, ignore pedantic ones
reportPrivateUsage = "none"
reportUnusedFunction = "none"
reportUnusedVariable = "none"
reportUnusedImport = "none"
reportConstantRedefinition = "none"
reportUnusedClass = "none"
reportUntypedClassDecorator = "none"
reportImplicitStringConcatenation = "none"
# Enable additional type checking features
reportCallIssue = "error"
reportArgumentType = "error"
reportIncompatibleVariableOverride = "error"
reportOverlappingOverload = "error"
reportUnsupportedDunderAll = "error"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# _version.py is generated at build time by hatch-vcs and is not in
# version control, so it is absent from a bare checkout -- which is how
# the pre-commit hook and pre-commit.ci see the tree. __init__.py guards
# the import with try/except and falls back, but mypy reports the
# missing module regardless of the handler. Every other consumer imports
# the resolved string from the package, so this exemption covers the one
# place that must name the generated module.
#
# A per-line type: ignore cannot be used here: warn_unused_ignores is
# enabled, so it would error wherever the file *has* been generated.
module = ["gha_workflow_linter._version"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "tests.test_action_call_check_comprehensive",
    "tests.test_github_api_comprehensive",
    "tests.test_config_comprehensive",
    "tests.test_cli_comprehensive"
]
disable_error_code = ["attr-defined", "call-arg", "arg-type", "comparison-overlap", "index", "misc", "func-returns-value", "call-overload", "union-attr", "var-annotated", "operator", "no-untyped-def"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=gha_workflow_linter",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
    # Fail (with a traceback of all threads) any test that hangs, instead of
    # silently consuming the job's timeout-minutes. The thread method dumps
    # stacks even when the hang is in C/subprocess code. No individual test
    # should take anywhere near this long.
    "--timeout=120",
    "--timeout-method=thread",
]
filterwarnings = [
    "ignore:install \"ipywidgets\" for Jupyter support:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Keep the transient coverage database out of the working tree.
# coverage.py resolves a relative data_file against the current
# directory, so the default '.coverage' lands wherever pytest runs and
# can be picked up by tests that inspect on-disk content. TEMP is
# set on Windows, where /tmp does not exist; elsewhere it is normally
# unset and the /tmp fallback applies. An explicit value also
# satisfies python-test-action's data_file configuration check.
# COVERAGE_FILE (env) still takes precedence when set.
data_file = "${TEMP-/tmp}/.coverage.gha-workflow-linter"
source = ["gha_workflow_linter"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
