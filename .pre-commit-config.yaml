---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

ci:
  autofix_prs: false
  # pre-commit.ci sandbox prevents network calls; aislop runs engines
  # that can call the network at scan time, so it cannot run there
  # either. gha-workflow-linter validates action calls over the
  # network; pytest runs the full suite.
  skip: [pytest, gha-workflow-linter, aislop]
  autofix_commit_msg: |
    Chore: pre-commit autofixes

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>
  autoupdate_commit_msg: |
    Chore: pre-commit autoupdate

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>

exclude: "^docs/conf.py"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args:
          - --branch=dev
          - --branch=master
          - --branch=main
          - --branch=rc
          - --branch=production

  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98 # frozen: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        types: [yaml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 7c55798a78262d14b2074abf623d8a992ebb70d4  # frozen: v0.16.2
    hooks:
      - id: ruff
        files: ^(src|scripts|tests)/.+\.py$
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^(src|scripts|tests)/.+\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 41e691678310dfd3833f7ab4e180ddb014310356  # frozen: v2.3.0
    hooks:
      - id: mypy
        # Analyse a fixed set rather than whatever happens to be staged.
        # The hook runs in an isolated virtualenv built from
        # additional_dependencies, which carries the third-party packages
        # but not gha_workflow_linter itself. Passed only test files, the
        # imports from the package cannot resolve and every imported name
        # degrades to Any, which under strict = true turns each use into
        # an error (disallow_subclassing_any, warn_return_any). Passing
        # src/ alongside the rest lets the imports resolve from source,
        # so the checking gets stronger rather than weaker: no
        # strictness setting is relaxed here, and what may go
        # unresolved is stated per module in [tool.mypy] rather than
        # waved through wholesale. One such exemption exists, for the
        # generated _version module; see the note beside it.
        # The set matches [tool.basedpyright] include in pyproject.toml,
        # which lists every tracked Python location; keep them in step.
        #
        # args replaces the hook's defaults rather than adding to them,
        # and its --ignore-missing-imports is deliberately not repeated
        # here. That flag overrode ignore_missing_imports = false in
        # pyproject.toml, so anything absent from the virtualenv below
        # became Any and every use of it went unchecked in silence --
        # pytest among them, which is why it now appears there. Dropping
        # the flag is what makes the per-module overrides in
        # [tool.mypy] the single account of what may go unresolved.
        pass_filenames: false
        args: ['src', 'tests', 'scripts', 'examples']
        additional_dependencies:
          - pydantic>=2.10.3
          - pydantic-settings>=2.7.0
          - typer>=0.15.0
          - types-pyyaml>=6.0.12.20241230
          - pyyaml>=6.0.2
          - rich>=13.9.4
          - httpx>=0.28.1
          - typing-extensions>=4.12.0
          # Needed now that tests/ is analysed: the isolated virtualenv
          # has to resolve what the test modules import, or every use of
          # an unresolved name becomes an error under strict = true.
          - pytest>=8.0.0

  # Requires a mirror, primary repo lacks .pre-commit-hooks.yaml
  - repo: https://github.com/DetachHead/basedpyright-prek-mirror
    rev: d55eabd2531b4f4a4c49c30fba627ce3a636ab79  # frozen: 1.39.9
    hooks:
      - id: basedpyright
        # No `files:` filter on purpose. This hook previously carried
        # `^src/.+\.py$`, so tests/, scripts/ and examples/ were never
        # type-checked and real findings (dead isinstance narrowing in
        # tests/conftest.py, 49 unannotated mock parameters) went
        # unnoticed. Relying on the hook's default python file matching
        # means a new top-level Python directory is covered the day it
        # appears, with no config change to forget. Keep
        # [tool.basedpyright] include in pyproject.toml in step for the
        # benefit of editors and bare invocations.

  - repo: https://github.com/btford/write-good
    rev: ab66ce10136dfad5146e69e70f82a3efac8842c1 # frozen: v1.0.8
    hooks:
      - id: write-good
        files: "\\.(rst|md|markdown|mdown|mkdn)$"
        # write-good targets reader-facing prose, where passive voice and
        # hedging genuinely cost clarity. ALLOW_LIST_FEATURE.md is a dense
        # technical specification of a different genre: there "only",
        # "deliberately" and "silently" carry precise meaning, and passive
        # constructions ("the SHA is peeled to a commit") read more clearly
        # than forced active ones. Enforcing the same style rules on it
        # produced ~200 findings, none of them real. Excluded by name
        # rather than by directory so future docs/ prose stays covered.
        exclude: ^docs/ALLOW_LIST_FEATURE\.md$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--fix"]

  - repo: https://github.com/fsfe/reuse-tool
    rev: 9fabf9eb815a57aac116b435e8346c200cdb8604  # frozen: v6.2.0
    hooks:
      - id: reuse

  # Replaces: https://github.com/rhysd/actionlint
  # Permits actionlint to run both locally and with precommit.ci/GitHub
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: c04ed26e40637cab1aa9879c693832a9c120fb20  # frozen: v1.7.12.24
    hooks:
      - id: actionlint

  # Check for misspellings in documentation files
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell

  # Catch AI slop developer-side before it reaches a pull request.
  # Runs the full-repository quality gate, scored against
  # .aislop/config.yml. A local hook installing the published npm
  # package: the scanaislop/aislop git repository does not ship the
  # built dist/, so its bundled pre-commit hook cannot install. Bump
  # the pinned version here manually when new aislop releases ship.
  - repo: local
    hooks:
      - id: aislop
        name: aislop
        entry: aislop ci --human
        language: node
        additional_dependencies: ["aislop@0.13.1"]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: c4654a7e007c9619a5eb63c39a456572a0fa1851  # frozen: 0.38.0
    hooks:
      - id: check-github-actions
      - id: check-github-workflows
      - id: check-jsonschema
        name: Check GitHub Workflows set timeout-minutes
        args:
          - --builtin-schema
          - github-workflows-require-timeout
        files: ^\.github/workflows/[^/]+$
        types:
          - yaml
      - id: check-readthedocs

  # GitHub Actions workflow linter (local development version)
  - repo: local
    hooks:
      - id: gha-workflow-linter
        name: GitHub Actions Workflow Linter
        description: Validate GitHub Actions workflows and action calls
        entry: gha-workflow-linter
        language: python
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
        args: [lint, ., --quiet]
        always_run: false
        require_serial: true

  # Run tests last to ensure all code changes from other hooks are tested
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv
        # pytest lives in the dev EXTRA, not a dependency group, so
        # plain 'uv run' does not install it and the hook fails with
        # exit 127. pre-commit.ci skips this hook, so the breakage was
        # only ever visible locally.
        args: [run, --extra, dev, pytest, --tb=short, -q]
        language: system
        pass_filenames: false
        always_run: true
